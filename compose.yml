services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:5050:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: